name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0)"
        required: false

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Release Tag
        id: tag_info
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          else
            PKG_VERSION=$(node -p "require('./package.json').version")
            TAG="v${PKG_VERSION}"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "Release tag determined as: ${TAG}"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build plugin artifacts
        run: pnpm build

      - name: Package Plugin Distribution Zip
        id: package
        run: |
          TAG_NAME="${{ steps.tag_info.outputs.tag }}"
          ZIP_NAME="figma-to-code-plugin-${TAG_NAME}.zip"

          mkdir -p release-pkg/apps/plugin/dist
          cp manifest.json release-pkg/
          cp -r apps/plugin/dist/* release-pkg/apps/plugin/dist/

          cd release-pkg
          zip -r "../${ZIP_NAME}" .
          cd ..

          echo "zip_name=${ZIP_NAME}" >> $GITHUB_OUTPUT

      - name: Create / Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ steps.tag_info.outputs.tag }}
          tag_name: ${{ steps.tag_info.outputs.tag }}
          files: ${{ steps.package.outputs.zip_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
